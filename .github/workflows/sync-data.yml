name: Sincronizar Google Sheets y paipus

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: sync-mahjong-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Sin esto cada corrida vuelve a pedir los 24 paipus a Mahjong Soul, que
      # responde 540 al pasarse de cuota. Con caché solo se piden los nuevos.
      - name: Reutilizar paipus ya descargados
        uses: actions/cache@v4
        with:
          path: data/raw-paipu
          key: raw-paipu-${{ github.run_id }}
          restore-keys: raw-paipu-
      - name: Sincronizar planilla y paipus
        env:
          MAJSOUL_UID: ${{ secrets.MAJSOUL_UID }}
          MAJSOUL_TOKEN: ${{ secrets.MAJSOUL_TOKEN }}
          MAJSOUL_DEVICE_ID: ${{ secrets.MAJSOUL_DEVICE_ID }}
          MAJSOUL_CONTEST_ID_B: ${{ secrets.MAJSOUL_CONTEST_ID_B }}
        run: python scripts/sync.py
      - name: Publicar cambios de datos
        run: |
          if git diff --quiet -- data; then
            echo "No hay cambios"
            exit 0
          fi
          git config user.name "mahjong-chile-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/liga.json data/stats.json data/sync-status.json data/generated.js
          git commit -m "data: sincronizar resultados"
          git push
      - name: Auditar estadísticas avanzadas
        run: |
          python3 - <<'EOF'
          import json, sys
          from scripts.sync import advanced_stats_health
          stats = json.load(open('data/stats.json'))
          status = json.load(open('data/sync-status.json'))
          health = advanced_stats_health(stats, status)
          print('Estadísticas avanzadas:', health['summary'])
          for issue in health['issues']:
              print(f"::warning::Paipu {issue['status']} en {issue['cell']}: {issue['message']}")
          if health['submitted'] and not health['with_hands']:
              print('::error::Hay paipus enviados pero ninguno aportó manos. La sesión técnica no está decodificando registros (REQUIERE_AUTH/ERROR).', file=sys.stderr)
              sys.exit(1)
          print('OK')
          EOF
      - name: Subir paipus descargados (depuración)
        if: ${{ always() && hashFiles('data/raw-paipu/*.pb') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: raw-paipu
          path: data/raw-paipu/*.pb
          if-no-files-found: ignore
