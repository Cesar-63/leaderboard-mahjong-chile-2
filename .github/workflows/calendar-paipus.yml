name: Paipus del torneo hacia el Calendario

on:
  workflow_dispatch:
    inputs:
      fail_on_issues:
        description: "Falla el job si hay conflictos o partidas sin mesa"
        type: boolean
        default: false
  schedule:
    # 09:20 en Chile (verano) / 08:20 (invierno): después de las sesiones.
    - cron: "20 12 * * *"

permissions:
  contents: read

# Mahjong Soul admite una sola sesión por cuenta: compartir grupo con
# sync-data.yml impide que los dos workflows hagan login al mismo tiempo y se
# expulsen entre ellos.
concurrency:
  group: sync-mahjong-data
  cancel-in-progress: false

jobs:
  calendario:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Leer las salas de torneo y proponer paipus
        env:
          MAJSOUL_UID: ${{ secrets.MAJSOUL_UID }}
          MAJSOUL_TOKEN: ${{ secrets.MAJSOUL_TOKEN }}
          MAJSOUL_DEVICE_ID: ${{ secrets.MAJSOUL_DEVICE_ID }}
          MAJSOUL_CONTEST_ID_A: ${{ secrets.MAJSOUL_CONTEST_ID_A }}
          MAJSOUL_CONTEST_ID_B: ${{ secrets.MAJSOUL_CONTEST_ID_B }}
        run: |
          ARGS=""
          if [ "${{ inputs.fail_on_issues }}" = "true" ]; then
            ARGS="--fail-on-issues"
          fi
          python scripts/fill_calendar_paipus.py $ARGS
      - name: Subir el reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calendar-paipus
          path: reports/calendar-paipus.*
          if-no-files-found: warn
